<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fav-base" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1122bb"/>
      <stop offset="28%"  stop-color="#1122bb"/>
      <stop offset="78%"  stop-color="#05081e"/>
    </radialGradient>
    <radialGradient id="fav-hl" cx="36%" cy="33%" r="44%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#b8d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b8d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fav-mid" cx="66%" cy="66%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3366ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3366ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="fav-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="13" fill="#00e5ff" opacity="0.2" filter="url(#fav-glow)"/>
  <!-- Orb -->
  <circle cx="16" cy="16" r="13" fill="url(#fav-base)"/>
  <circle cx="16" cy="16" r="13" fill="url(#fav-mid)"/>
  <circle cx="16" cy="16" r="13" fill="url(#fav-hl)"/>
</svg>
