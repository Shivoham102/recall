name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run offline unit tests
        # Only tests/ — these mock external services. The root-level test_reminders.py /
        # test_recurrence.py are live-DB integration tests that need Supabase service-role
        # credentials and are run locally, not in CI.
        run: python -m pytest tests -q
        env:
          ANTHROPIC_API_KEY: test-key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key
