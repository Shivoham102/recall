<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Exact match to app CSS:
         radial-gradient(circle at 50% 50%, #1122bb 28%, #05081e 78%) -->
    <radialGradient id="orb-base" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1122bb"/>
      <stop offset="28%"  stop-color="#1122bb"/>
      <stop offset="78%"  stop-color="#05081e"/>
      <stop offset="100%" stop-color="#030410"/>
    </radialGradient>
    <!-- radial-gradient(circle at 38% 35%, rgba(184,212,255,0.92) 0%, transparent 44%) -->
    <radialGradient id="orb-highlight" cx="38%" cy="35%" r="44%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#b8d4ff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#b8d4ff" stop-opacity="0"/>
    </radialGradient>
    <!-- radial-gradient(circle at 66% 66%, rgba(51,102,238,0.82) 0%, transparent 54%) -->
    <radialGradient id="orb-mid" cx="66%" cy="66%" r="54%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3366ee" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#3366ee" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient bg glow (transparent bg) -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0.07"/>
      <stop offset="55%"  stop-color="#7700ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7700ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Shimmer: linear-gradient(128deg, transparent 38%, rgba(255,255,255,0.09) 50%, transparent 62%) -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="38%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.09"/>
      <stop offset="62%"  stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="cyan-glow"   x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="48"/>
    </filter>
    <filter id="purple-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
    <clipPath id="orb-clip">
      <circle cx="512" cy="512" r="460"/>
    </clipPath>
  </defs>

  <!-- Ambient transparent bg glow -->
  <circle cx="512" cy="512" r="512" fill="url(#bg-glow)"/>

  <!-- box-shadow: 0 0 48px rgba(0,229,255,0.22) -->
  <circle cx="512" cy="512" r="460" fill="#00e5ff" opacity="0.22" filter="url(#cyan-glow)"/>
  <!-- box-shadow: 0 0 100px rgba(119,0,255,0.12) -->
  <circle cx="512" cy="512" r="460" fill="#7700ff" opacity="0.12" filter="url(#purple-glow)"/>

  <!-- Orb base -->
  <circle cx="512" cy="512" r="460" fill="url(#orb-base)"/>
  <!-- Orb mid layer (bottom-right blue) -->
  <circle cx="512" cy="512" r="460" fill="url(#orb-mid)"/>
  <!-- Orb highlight (top-left white-blue) -->
  <circle cx="512" cy="512" r="460" fill="url(#orb-highlight)"/>
  <!-- Shimmer sweep -->
  <rect x="62" y="62" width="900" height="900" fill="url(#shimmer)" clip-path="url(#orb-clip)"/>
</svg>
