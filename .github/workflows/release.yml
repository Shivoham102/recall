name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle-glob: 'bundle/nsis/*.exe'
            sig-glob: 'bundle/nsis/*.exe.sig'
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            bundle-glob: 'bundle/dmg/*.dmg'
            updater-glob: 'bundle/macos/*.app.tar.gz'
            sig-glob: 'bundle/macos/*.app.tar.gz.sig'
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundle-glob: 'bundle/appimage/*.AppImage'
            sig-glob: 'bundle/appimage/*.AppImage.sig'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Write frontend .env
        shell: bash
        run: |
          printf 'VITE_API_BASE=%s\n'          '${{ secrets.VITE_API_BASE }}'          > app/.env
          printf 'VITE_SUPABASE_URL=%s\n'      '${{ secrets.SUPABASE_URL }}'           >> app/.env
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' '${{ secrets.SUPABASE_ANON_KEY }}'      >> app/.env
          printf 'VITE_USE_CARTESIA_LINE=%s\n' 'true'                                  >> app/.env

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ hashFiles('app/src-tauri/icons/**', 'app/src-tauri/tauri.conf.json') }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Node dependencies
        working-directory: app
        run: pnpm install

      - name: Build Tauri app
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.rust-target }}

      - name: Publish release
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" \
            || gh release create "${{ github.ref_name }}" \
                 --title "Recall ${{ github.ref_name }}" \
                 --generate-notes

          # Collect artifacts: installer, .sig, and macOS updater tar (if present)
          ARTIFACTS=$(echo app/src-tauri/target/${{ matrix.rust-target }}/release/${{ matrix.bundle-glob }})
          ARTIFACTS="$ARTIFACTS $(echo app/src-tauri/target/${{ matrix.rust-target }}/release/${{ matrix.sig-glob }})"
          if [ -n "${{ matrix.updater-glob }}" ]; then
            ARTIFACTS="$ARTIFACTS $(echo app/src-tauri/target/${{ matrix.rust-target }}/release/${{ matrix.updater-glob }})"
          fi

          gh release upload "${{ github.ref_name }}" $ARTIFACTS --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
